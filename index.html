<style>
:root{color-scheme:dark;--bg:#07090e;--card:#11151d;--card2:#161b26;--text:#eef1f6;--muted:#8d97a8;--line:#222a37;--accent:#38bdf8;--accent2:#a78bfa;--accent-soft:rgba(56,189,248,.12);--good:#4ade80;--good-soft:rgba(74,222,128,.12);--bad:#fb7185;--bad-soft:rgba(251,113,133,.13);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);--grad:linear-gradient(135deg,#38bdf8,#a78bfa)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg) radial-gradient(900px 500px at 85% -10%,rgba(167,139,250,.16),transparent 60%) no-repeat,var(--bg) radial-gradient(700px 400px at -10% 10%,rgba(56,189,248,.12),transparent 60%) no-repeat;background-color:var(--bg);background-attachment:fixed;color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:rgba(7,9,14,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);max-width:44vw}
nav{display:flex;gap:2px;padding-bottom:8px}
nav button{flex:1 1 auto;font:inherit;font-weight:600;font-size:13px;padding:9px 3px;border:0;border-radius:10px;background:transparent;color:var(--muted)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{padding:14px 0 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.q{font-size:17px;font-weight:600;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.opt b{color:var(--muted);margin-right:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--grad);border-color:transparent;color:#07090e;box-shadow:0 6px 20px rgba(56,189,248,.25)}

.btn.grow{flex:1}.btn.sm{padding:7px 12px;font-size:14px}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.toggles label{display:flex;align-items:center;gap:6px}
.toggles input{width:18px;height:18px}
.stats{font-size:14px;color:var(--muted);margin-bottom:10px}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .term{font-size:21px;font-weight:700}
.flash .def{font-size:17px;margin-top:12px}
.flash .hint{font-size:13px;color:var(--muted);margin-top:14px}
.glist a{display:block;padding:14px 16px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--line)}
.glist a:last-child{border-bottom:0}
.glist{padding:0;overflow:hidden}
.guide{overflow-wrap:break-word}
.guide h1{font-size:22px;line-height:1.25}.guide h2{font-size:19px;margin-top:28px}.guide h3{font-size:17px}
.guide table{border-collapse:collapse;font-size:14px;min-width:100%}
.guide th,.guide td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.guide th{background:var(--accent-soft)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.guide blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.back{margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
#toTop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:none}
.timer{position:sticky;top:96px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;margin-bottom:12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.grid button{font:inherit;font-size:13px;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.grid button.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.grid button.flag{border-color:var(--warn);color:var(--warn)}
.grid button.cur{outline:2px solid var(--accent)}
.grid button.right{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}
.grid button.wrong{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.big{font-size:44px;font-weight:800;line-height:1.1;margin:4px 0}
.pass{color:var(--good)}.fail{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.g{background:var(--good)}.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.chrow{padding:12px 0;border-bottom:1px solid var(--line)}
.chrow:last-child{border-bottom:0}
.chrow .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.chrow .s{font-size:13px;color:var(--muted)}
.choice{display:flex;gap:8px;margin:10px 0 14px}
.choice .btn{flex:1;padding:12px 4px}
.choice .btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.g{background:var(--good-soft);color:var(--good)}.tag.b{background:var(--bad-soft);color:var(--bad)}.tag.w{background:var(--warn-soft);color:var(--warn)}
ul.tight{margin:6px 0;padding-left:20px}
.badge{display:inline-block;min-width:18px;margin-left:3px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;vertical-align:1px}
.badge:empty{display:none}
.dots{letter-spacing:2px;color:var(--good)}
.streak{font-weight:700;color:var(--warn)}
.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

.card{border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card))}
.opt{background:var(--card2);transition:transform .08s}.opt:active{transform:scale(.98)}
.btn:active{transform:scale(.97)}
.logo{display:flex;align-items:center;gap:8px;flex:1;background:none;border:0;color:var(--text);font:inherit;padding:0;text-align:left}
.logo b{white-space:nowrap;font-size:16px;letter-spacing:.2px}.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;line-height:1}
.hero{text-align:center;padding:18px 4px 6px}
.hero .wolf{display:block;margin:0 auto;width:96px;height:96px;filter:drop-shadow(0 8px 30px rgba(56,189,248,.45))}
.eyebrow{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h2{font-size:30px;line-height:1.12;margin:10px 0 8px;letter-spacing:-.5px;font-weight:800}
.hero h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0 auto;max-width:420px;font-size:15px}
.count{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.count div{min-width:66px;padding:10px 6px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.count b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.count small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpis div{padding:12px 8px;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-align:center}
.kpis b{display:block;font-size:22px}.kpis small{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile{position:relative;text-align:left;font:inherit;color:var(--text);padding:16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));min-height:112px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:26px;line-height:1}
.tile b{font-size:17px;display:block;margin-top:10px}.tile small{color:var(--muted);font-size:13px}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;justify-content:flex-start;align-items:center;gap:14px;background:var(--grad);color:#07090e;border:0;box-shadow:0 10px 30px rgba(56,189,248,.25)}
.tile.wide small{color:rgba(7,9,14,.7)}.tile.wide b{margin:0}
.tile .badge{position:absolute;top:12px;right:12px;font-size:12px;line-height:22px;min-width:22px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;letter-spacing:1px}
.timer{top:calc(var(--hh,140px) + 6px)}

body.splash-on header{display:none}
body.splash-on main{padding-top:0}
.splash{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 8px) 0 24px}
.hero-wrap{margin:0 -16px}.hero-art{display:block;width:100%;height:auto;max-height:46svh}
.splash .hero{padding-top:0;margin-top:-18px;position:relative}
.btn.go{display:block;width:100%;max-width:420px;margin:18px auto 0;font-size:18px;padding:16px;border-radius:16px}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:16px}
.feat span{font-size:12px;color:var(--muted);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.dash-h{padding:4px 0 2px}.dash-h h3{font-size:24px;margin:2px 0 4px;letter-spacing:-.3px}
.mini{font-size:14px;color:var(--muted)}
.eyebrow{display:block}

#sec{gap:4px}#sec button{font-size:13px;padding:9px 4px}
.sub{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}.sub::-webkit-scrollbar{display:none}
.sub button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.sub button.on{background:var(--grad);color:#07090e;border-color:transparent}
.sub .badge{margin-left:2px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
#flash.ok{animation:fl .5s ease-out;background:radial-gradient(circle at 50% 60%,rgba(74,222,128,.45),rgba(74,222,128,.15) 60%,transparent)}
#flash.no{animation:fl .7s ease-out;background:radial-gradient(circle at 50% 60%,rgba(251,113,133,.6),rgba(251,113,133,.25) 60%,rgba(251,113,133,.1))}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.shake,.opt.wrong{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.bump,.opt.right{animation:pop .35s ease}
.modehead{font-size:13px;color:var(--muted);margin-bottom:8px}.modehead b{color:var(--text)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.ring{position:relative;text-align:center;padding:10px 4px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.ring svg{width:70px;height:70px;display:block;margin:0 auto}
.ring .arc{transition:stroke-dasharray 1s ease}
.ring b{position:absolute;top:33px;left:0;right:0;font-size:16px}
.ring small{font-size:12px;color:var(--muted)}
.sect{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.sphead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:6px}.sphead b{font-size:26px}
.tbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}.tbar i{display:block;height:100%;background:var(--grad);transition:width .2s linear}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{font:inherit;font-size:13.5px;line-height:1.35;min-height:84px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--text);text-align:left;transition:opacity .35s,transform .35s}
.mt.t{font-weight:700;font-size:15px;text-align:center;border-color:rgba(56,189,248,.35)}
.mt.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.03)}
.mt.right{border-color:var(--good);background:var(--good-soft)}.mt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mt.gone{opacity:0;transform:scale(.85);pointer-events:none}

.welcome{font-size:18px;margin-top:16px}.welcome b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nameform{max-width:420px;margin:16px auto 0;text-align:left}
.nameform label{display:block;font-weight:700;margin-bottom:6px;text-align:center}
.nameform input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--text);outline:none;text-align:center}
.nameform input:focus{border-color:var(--accent)}
.nameform .go{margin-top:10px}
.plist{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted)}

/* howling wolf: 6s loop */
.hero-art .whead{transform-box:view-box;transform-origin:100px 200px;animation:howl 6s ease-in-out infinite}
.hero-art .mouth{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:mouth 6s ease-in-out infinite}
.hero-art .waves path{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:wave 6s ease-out infinite}
.hero-art .waves .w2{animation-delay:.25s}.hero-art .waves .w3{animation-delay:.5s}
.hero-art .hglow{transform-box:fill-box;transform-origin:50% 50%;animation:glow 6s ease-in-out infinite}
.hero-art .stars circle{animation:tw 3s ease-in-out infinite}.hero-art .stars circle:nth-child(2n){animation-delay:1.3s}.hero-art .stars circle:nth-child(3n){animation-delay:2.1s}
@keyframes howl{0%,30%{transform:none}42%,74%{transform:translateY(-14px) rotate(-3deg) scaleY(.9)}50%{transform:translateY(-15px) rotate(3deg) scaleY(.9)}58%{transform:translateY(-15px) rotate(-2deg) scaleY(.9)}66%{transform:translateY(-15px) rotate(2deg) scaleY(.9)}86%,100%{transform:none}}
@keyframes mouth{0%,36%{transform:scaleY(0)}46%,72%{transform:scaleY(1)}82%,100%{transform:scaleY(0)}}
@keyframes wave{0%,44%{opacity:0;transform:translateY(10px) scale(.7)}52%{opacity:.95}80%{opacity:0;transform:translateY(-22px) scale(1.35)}100%{opacity:0}}
@keyframes glow{0%,35%{transform:scale(1);opacity:.8}55%,70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:.8}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.hero-art *{animation:none!important}}

.hero-wrap{position:relative}
.bubble{position:absolute;z-index:2;right:8px;top:3%;max-width:42%;font:inherit;font-size:13.5px;font-weight:700;line-height:1.3;text-align:left;color:#07090e;background:#f1f5f9;border:0;border-radius:16px 16px 16px 4px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);transform-origin:0% 100%;animation:bub 6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:-7px;bottom:6px;border:8px solid transparent;border-right-color:#f1f5f9;border-left:0}
.bubble.pin{animation:none;opacity:1;transform:none}
@keyframes bub{0%,72%{opacity:0;transform:scale(.6) translateY(6px)}78%,96%{opacity:1;transform:none}100%{opacity:0;transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}

/* talking wolf (replaces howl) */
.hero-art .whead,.hero-art .hglow{animation:none!important}
.hero-art .waves{display:none}
.hero-art .mouth{animation:none;transform:scaleY(0);transition:transform .08s}
.hero-art.talking .mouth{animation:talk .16s ease-in-out infinite alternate}
.hero-art.talking .whead{animation:bob .32s ease-in-out infinite alternate!important}
@keyframes talk{from{transform:scaleY(.1)}to{transform:scaleY(.85)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.bubble{animation:none!important;opacity:0;transform:scale(.6) translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;min-height:1.3em}
.bubble.show{opacity:1;transform:none}
.bubble .caret{display:inline-block;width:2px;height:1em;background:#07090e;margin-left:2px;vertical-align:-2px;animation:tw .8s steps(1) infinite}
</style>

<body>
<header><div class="wrap">
  <div class="top"><button class="logo" onclick="setView('dash')"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="wg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><polygon fill="url(#wg2)" points="9,5 24,21 40,21 55,5 53,30 45,44 32,59 19,44 11,30"/><polygon fill="#07090e" opacity=".35" points="13,11 22,21 15,25"/><polygon fill="#07090e" opacity=".35" points="51,11 42,21 49,25"/><polygon fill="#ffffff" opacity=".22" points="24,21 40,21 32,33"/><polygon fill="#07090e" points="18,30 28,33 21,36"/><polygon fill="#07090e" points="46,30 36,33 43,36"/><polygon fill="#ffffff" opacity=".3" points="25,39 39,39 32,52"/><polygon fill="#07090e" points="28.5,47 35.5,47 32,52"/></svg><span><small id="who">Wolf Prep</small><b>FL 2-40 Health</b></span></button><select id="ch"></select></div>
  <nav id="sec"><button data-s="games">🎮 Study Games<span id="mbadge" class="badge"></span></button><button data-s="exams">📝 Exam</button><button data-s="guides">📖 Guides</button><button data-s="stats">📊 Stats</button></nav>
  <div id="sub" class="sub"></div>
</div></header>
<div id="flash"></div><main class="wrap" id="app"><p class="empty">Loading…</p></main>
<button class="btn" id="toTop" onclick="scrollTo(0,0)">↑ Top</button>
<script src="marked.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
/* profiles: each name gets its own saved progress on this device */
const G={get(k,d){try{return JSON.parse(localStorage.getItem('fl240:'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('fl240:'+k,JSON.stringify(v))}catch(e){}}};
const DATA_KEYS=['results','known','exams','exam','opts','examSize','mist','mcleared','mbest','speedBest','matchBest','ch'];
let PROFILES=G.get('profiles',[]), ACTIVE=G.get('active',null);
if(ACTIVE&&!PROFILES.includes(ACTIVE))ACTIVE=null;
const pkey=k=>'fl240:'+(ACTIVE?'p:'+ACTIVE+':':'')+k;

  exam={qs,ans:{},flags:{},cur:0,start:Date.now(),limit:Math.round(n*72),ch,done:false};
  store.set('exam',exam);renderExam();scrollTo(0,0);
}
function left(){return Math.max(0,Math.round(exam.limit-(Date.now()-exam.start)/1000))}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

    ${last.length?`<div class="card"><p class="q" style="font-size:15px">Recent exams</p>${last.map(e=>`<div class="chrow"><div class="t"><span>${new Date(e.date).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})} · ${e.n} Qs</span><span class="tag ${e.score>=PASS?'g':'b'}">${e.score}% ${e.score>=PASS?'PASS':'FAIL'}</span></div></div>`).join('')}</div>`:''}`;
    return;
  }
  if(left()<=0)return submitExam();
  const q=QBY[exam.qs[exam.cur]], a=exam.ans[exam.qs[exam.cur]], nAns=Object.keys(exam.ans).length;
  let h=`<div class="timer ${left()<300?'low':''}"><span id="tleft">⏱ ${fmt(left())}</span><span>${nAns}/${exam.qs.length} answered</span><button class="btn sm" onclick="confirmSubmit()">Submit</button></div>

  q.o.forEach((o,i)=>{const L='ABCD'[i];h+=`<button class="opt ${a===L?'sel':''}" onclick="exPick('${L}')"><b>${L}</b>${inl(o)}</button>`});
  h+=`</div><div class="row"><button class="btn" onclick="exGo(-1)" ${exam.cur?'':'disabled'}>Back</button><button class="btn pri grow" onclick="${exam.cur<exam.qs.length-1?'exGo(1)':'confirmSubmit()'}">${exam.cur<exam.qs.length-1?'Next':'Finish & grade'}</button></div>

  <p class="stats" style="margin:12px 0 0"><a href="#" style="color:var(--muted)" onclick="if(confirm('Quit this exam without grading?')){exam=null;store.set('exam',null);renderExam()}return false">Quit exam</a></p></div>`;
  app.innerHTML=h;
  tick=setInterval(()=>{const s=left();const el=$('#tleft');if(!el){clearInterval(tick);return}el.textContent='⏱ '+fmt(s);if(s<300)el.parentNode.classList.add('low');if(s<=0){clearInterval(tick);submitExam()}},1000);
}
function exPick(L){const id=exam.qs[exam.cur];exam.ans[id]=L;store.set('exam',exam);
  if(exam.cur<exam.qs.length-1){exam.cur++;store.set('exam',exam);setTimeout(()=>{renderExam();scrollTo(0,0)},180);app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.textContent.trim().startsWith(L)))}else renderExam()}
function exGo(d){exam.cur=Math.max(0,Math.min(exam.qs.length-1,exam.cur+d));store.set('exam',exam);renderExam();scrollTo(0,0)}
function flag(){const id=exam.qs[exam.cur];if(exam.flags[id])delete exam.flags[id];else exam.flags[id]=1;store.set('exam',exam);renderExam()}

/* ---------- Mistakes game ---------- */
function mItem(k){return k[0]==='q'?QBY[k.slice(2)]:TBY[k.slice(2)]}
function termQ(t){ // flashcard term -> multiple choice: definition shown, pick the term
  let pool=D.terms.filter(x=>x.ch==t.ch&&x.t!==t.t);if(pool.length<3)pool=D.terms.filter(x=>x.t!==t.t);
  const o=shuffle([t.t,...shuffle(pool).slice(0,3).map(x=>x.t)]);const a='ABCD'[o.indexOf(t.t)];
  return {ch:t.ch,q:'Which term matches this meaning? '+t.d,o,a,af:a,w:`**${t.t}**: ${t.d}`,term:1};
}
function startMist(n){
  const keys=shuffle(mistKeys()).slice(0,n||9999);
  mround={keys,i:0,right:0,ans:null,cleared:0,items:keys.map(k=>k[0]==='q'?QBY[k.slice(2)]:termQ(TBY[k.slice(2)]))};
  mstreak=0;renderMist();scrollTo(0,0);
}
function renderMist(){
  const keys=mistKeys(), total=Object.keys(mist).length, nq=keys.filter(k=>k[0]==='q').length, nt=keys.length-nq;
  if(!mround){
    const prog=pct(mcleared,mcleared+total);
    app.innerHTML=`<div class="card" style="text-align:center"><div class="stats" style="margin:0">Mistakes deck${ch==='all'?'':' · Chapter '+ch}</div><div class="big ${keys.length?'fail':'pass'}">${keys.length}</div>
    <div class="stats" style="margin:0">${nq} questions · ${nt} flashcard terms</div>
    <div class="bar" style="margin-top:12px"><i class="g" style="width:${prog}%"></i></div><div class="stats" style="margin:6px 0 0">${mcleared} cleared so far · best streak <span class="streak">${mbest}</span></div></div>
    ${keys.length?`<div class="row" style="margin-bottom:12px"><button class="btn pri grow" onclick="startMist(10)">Quick round (${Math.min(10,keys.length)})</button><button class="btn grow" onclick="startMist()">All ${keys.length}</button></div>`:`<p class="empty">${total?'No mistakes in this chapter. Switch to "All chapters" to see the rest.':'Nothing here yet. Every question you miss in Quiz or Exam, and every card you mark "Again", lands here.'}</p>`}
    <div class="card"><p class="q" style="font-size:15px">How it works</p><ul class="tight stats" style="margin:0">
    <li>Anything you miss anywhere on the site lands here automatically.</li>
    <li>Get it right <b>${MASTER} times in a row</b> to clear it. Miss it again and its count resets.</li>
    <li>Missed flashcards come back as multiple-choice: you see the meaning and pick the term.</li>
    <li>Answers show right away, so this is for learning. Use Exam to test yourself.</li></ul></div>`;
    return;
  }
  const r=mround;
  if(r.i>=r.items.length){
    const left=mistKeys().length;
    app.innerHTML=`<div class="card" style="text-align:center"><div class="stats" style="margin:0">Round done</div><div class="big ${pct(r.right,r.items.length)>=PASS?'pass':'fail'}">${r.right}/${r.items.length}</div>
    <p class="stats" style="margin:6px 0 0">${r.cleared} cleared this round · ${left} left in the deck</p></div>
    <div class="row">${left?`<button class="btn pri grow" onclick="startMist(10)">Another quick round</button>`:''}<button class="btn grow" onclick="mround=null;renderMist()">Back to deck</button></div>`;
    return;
  }
  const k=r.keys[r.i], q=r.items[r.i], st=k in mist?mist[k]:MASTER;
  let h=`<div class="meta"><span>Round: ${r.i+1} of ${r.items.length}</span><span>Streak <span class="streak">${mstreak}🔥</span></span></div>
  <div class="card ${r.ans&&r.ans===q.a?'pop':''}"><div class="meta"><span>Ch ${q.ch}${q.term?' · flashcard':' · Q'+q.n}</span><span title="right in a row">${'●'.repeat(Math.min(st,MASTER)).padEnd(MASTER,'○')} to clear</span></div><p class="q">${inl(q.q)}</p>`;
  q.o.forEach((o,i)=>{const L='ABCD'[i];let c='';if(r.ans){if(L===q.a)c='right';else if(L===r.ans)c='wrong'}
    h+=`<button class="opt ${c}" ${r.ans?'disabled':''} onclick="mPick('${L}')"><b>${L}</b>${inl(o)}</button>`});
  if(r.ans)h+=`<div class="why"><b>${r.ans===q.a?(r.justCleared?'Correct, and cleared! 🎉':'Correct. One more time to clear it.'):'Not quite. Answer: '+esc(q.af)+'.'}</b> ${inl(q.w)}</div>`;
  h+=`</div><div class="row"><button class="btn" onclick="mround=null;renderMist()">Quit</button><button class="btn pri grow" onclick="mNext()" ${r.ans?'':'disabled'}>Next</button></div>`;
  app.innerHTML=h;
}
function mPick(L){const r=mround,k=r.keys[r.i],q=r.items[r.i];r.ans=L;fx(L===q.a);
  if(L===q.a){r.right++;mstreak++;if(mstreak>mbest){mbest=mstreak;store.set('mbest',mbest)}r.justCleared=gotRight(k);if(r.justCleared)r.cleared++;if(k[0]==='q'){results[k.slice(2)]=1;store.set('results',results)}}
  else{mstreak=0;r.justCleared=false;missed(k);if(k[0]==='q'){results[k.slice(2)]=0;store.set('results',results)}else{delete known[k.slice(2)];store.set('known',known)}
    // missed again: bring it back later in this round
    if(r.items.length-r.i<40){r.keys.push(k);r.items.push(k[0]==='q'?q:termQ(TBY[k.slice(2)]))}}
  renderMist()}
function mNext(){mround.i++;mround.ans=null;renderMist();scrollTo(0,0)}

/* ---------- Speed Round ---------- */
let sp=null;
function spNext(){const pool=D.questions.filter(inCh),tp=D.terms.filter(inCh);
  const useT=Math.random()<.5&&tp.length>3;let it;
  if(useT){const t=tp[Math.random()*tp.length|0];it={...termQ(t),key:'t:'+tid(t)}}else{const q=pool[Math.random()*pool.length|0];it={...q,key:'q:'+qid(q)}}
  sp.cur=it;sp.ans=null}
function renderSpeed(){clearInterval(tick);
  const best=store.get('speedBest',0);
  if(!sp||sp.over){const o=sp&&sp.over;
    app.innerHTML=`<div class="card" style="text-align:center"><div class="ic" style="font-size:44px">⚡</div><p class="q" style="font-size:22px;margin:6px 0">Speed Round</p>
    ${o?`<div class="big ${sp.score>=best&&sp.score?'pass':''}">${sp.score}</div><p class="stats">${sp.right} right · ${sp.wrong} wrong · best combo x${sp.maxc}${sp.score>=best&&sp.score?' · 🏆 new best!':''}</p>`:`<p class="stats">60 seconds. Questions and terms fire at you. Right answers build a combo multiplier. Every miss goes to your Mistakes deck.</p>`}
    <p class="stats">Best score: <b class="streak">${best}</b></p><button class="btn pri go" onclick="spStart()">${o?'Play again':'Start'}</button></div>`;return}

  <div class="card ${sp.ans?(sp.ans===q.a?'bump':'shake'):''}"><div class="meta"><span>Ch ${q.ch}${q.term?' · term':''}</span></div><p class="q">${inl(q.q)}</p>`;
  q.o.forEach((o,i)=>{const L='ABCD'[i];let c='';if(sp.ans){if(L===q.a)c='right';else if(L===sp.ans)c='wrong'}h+=`<button class="opt ${c}" ${sp.ans?'disabled':''} onclick="spPick('${L}')"><b>${L}</b>${inl(o)}</button>`});
  h+=`</div>`;app.innerHTML=h;
  tick=setInterval(()=>{const l=Math.max(0,sp.end-Date.now()),t=$('#spt'),b=$('#spbar');if(!t){clearInterval(tick);return}t.textContent=Math.ceil(l/1000)+'s';b.style.width=(l/600)+'%';if(!l){clearInterval(tick);spOver()}},200);
}
function spStart(){sp={score:0,right:0,wrong:0,combo:0,maxc:0,end:Date.now()+60000};spNext();renderSpeed()}
function spPick(L){const q=sp.cur;sp.ans=L;const ok=L===q.a;fx(ok);
  if(ok){sp.right++;sp.combo++;sp.maxc=Math.max(sp.maxc,sp.combo);sp.score+=Math.min(5,1+Math.floor((sp.combo-1)/3));gotRight(q.key)}else{sp.wrong++;sp.combo=0;missed(q.key)}
  if(q.key[0]==='q'){results[q.key.slice(2)]=ok?1:0;store.set('results',results)}
  renderSpeed();setTimeout(()=>{if(!sp||sp.over||view!=='speed')return;if(Date.now()>=sp.end)return spOver();spNext();renderSpeed()},ok?450:1300)}
function spOver(){if(!sp||sp.over)return;sp.over=true;if(sp.score>store.get('speedBest',0))store.set('speedBest',sp.score);renderSpeed()}

/* ---------- Match ---------- */
let mt=null;

  else{fx(false);mt.miss++;missed('t:'+tid(term));[ea,eb].forEach(e=>{e.classList.add('wrong','shake');setTimeout(()=>e.classList.remove('wrong','shake','sel'),600)});mt.sel=null}

   <p class="stats" style="margin:0 0 10px">Progress saves automatically on this phone${ACTIVE?' under <b>'+esc(ACTIVE)+'</b>':''}, even after you close the site. It only goes away if you clear your browser data or use a private tab. To move it to another device, copy your backup code, send it to yourself, and paste it there.</p>
   <div class="row"><button class="btn grow" onclick="const c=backupCode();$('#bk').value=c;$('#bk').style.display='block';$('#bk').select();const btn=this;try{navigator.clipboard.writeText(c).then(()=>btn.textContent='Copied ✓',()=>btn.textContent='Code shown below')}catch(e){}">Copy backup code</button><button class="btn grow" onclick="const c=prompt('Paste your backup code (starts with WOLF1.)');if(c)restoreCode(c)">Restore from code</button></div>
   <textarea id="bk" readonly style="display:none;width:100%;margin-top:10px;height:80px;font:12px monospace;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px"></textarea>
   <div class="row" style="margin-top:10px"><button class="btn sm" onclick="setView('home')">👤 Switch profile</button></div></div>`;
  h+=`<p class="stats"><a href="#" style="color:var(--muted)" onclick="if(confirm('Erase all quiz, card and exam progress?')){results={};known={};exams=[];exam=null;mist={};mcleared=0;mbest=0;['results','known','mist'].forEach(k=>store.set(k,{}));store.set('exams',[]);store.set('exam',null);store.set('mcleared',0);store.set('mbest',0);badge();renderStats()}return false">Reset all progress</a></p>`;
  app.innerHTML=h;
}
function goCh(n,v){ch=String(n);store.set('ch',ch);$('#ch').value=ch;setView(v)}

/* ---------- Guides ---------- */
function renderGuides(){
  if(guideOpen){app.innerHTML=`<button class="btn back" onclick="guideOpen=null;render();scrollTo(0,0)">← All guides</button><div class="card guide"><p class="empty">Loading guide…</p></div>`;
    fetch(D.guides[guideOpen]).then(r=>r.text()).then(md=>{const el=app.querySelector('.guide');el.innerHTML=marked.parse(md);
      el.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.parentNode.insertBefore(w,t);w.appendChild(t)})});
    return}
  const list=Object.keys(D.guides).map(Number).sort((a,b)=>a-b).filter(n=>ch==='all'||n==ch);
  app.innerHTML=`<div class="card glist">${list.map(n=>`<a href="#" onclick="guideOpen=${n};render();scrollTo(0,0);return false"><b>Chapter ${n}</b><br><span style="color:var(--muted)">${esc(D.titles[n])}</span></a>`).join('')}</div>`;
}
</script>
